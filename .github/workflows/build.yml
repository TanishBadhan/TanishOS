name: TanishOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble and build kernel image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install NASM
        run: |
          sudo apt-get update
          sudo apt-get install --yes nasm

      - name: Build operating system image
        run: make
